<!doctype html>
<html lang="{{ site.LanguageCode | default "zh-cn" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.Params.description }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    {{ $style := resources.Get "css/main.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}">
  </head>
  <body data-site-base="{{ relURL "/" }}" data-search-index="{{ "search-index.json" | relURL }}">
    <header class="site-header">
      <a class="brand" href="{{ relURL "/" }}">{{ site.Title }}</a>
      <nav class="main-nav" aria-label="Main navigation">
        {{ range site.Menus.main }}
          <a href="{{ .URL | relURL }}">{{ .Name }}</a>
        {{ end }}
      </nav>
    </header>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <span>Powered by Hugo</span>
      <a href="{{ site.Params.githubRepo }}">Notes source</a>
    </footer>
    {{ $search := resources.Get "js/search.js" | minify | fingerprint }}
    <script src="{{ $search.RelPermalink }}" defer></script>
  </body>
</html>
