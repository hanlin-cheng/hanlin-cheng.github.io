{{ define "main" }}
  <article class="article">
    <header class="article-header">
      {{ with .Params.categories }}
        <p class="eyebrow">{{ delimit . " / " }}</p>
      {{ end }}
      <h1>{{ .Title }}</h1>
      {{ with .Params.source.path }}
        <a class="source-link" href="{{ site.Params.githubRepo }}/blob/main/{{ . }}">查看原始笔记</a>
      {{ end }}
    </header>
    <div class="article-body">
      {{ .Content }}
    </div>
  </article>
{{ end }}
