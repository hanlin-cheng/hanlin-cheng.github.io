{{/* A local, native dialog also supports static images without build-time dimensions. */}}
<dialog class="image-viewer" aria-label="图片放大预览">
    <div class="image-viewer-toolbar">
        <span>点击图片放大细节 · Esc 关闭</span>
        <button class="image-viewer-zoom" type="button" aria-pressed="false">放大细节</button>
        <button class="image-viewer-close" type="button" autofocus>关闭图片</button>
    </div>
    <div class="image-viewer-stage"><img class="image-viewer-image" alt=""></div>
</dialog>
